name: CI
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
# Least-privilege, not write-all: dorny/test-reporter needs `checks: write` to publish
# a report, and `pull-requests: write` so it can annotate the PR itself. This also covers
# dependabot-opened PRs (.github/dependabot.yml) - those run with a read-only GITHUB_TOKEN
# by default, so the report wouldn't appear at all without explicitly granting this here.
permissions:
  contents: read
  checks: write
  pull-requests: write
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # java.version in pom.xml is 25, so CI must run on a JDK that supports
      # `--release 25` - JDK 21 produced "release version 25 not supported" and
      # failed the compile step.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # No `docker compose up` here: every integration test starts its own
      # Testcontainers stack in-process (Kafka, PostgreSQL, Redis, LocalStack -
      # random ports, no external orchestration). We only need the Docker daemon
      # to be reachable.
      - name: Verify Docker is reachable (Testcontainers needs this)
        run: docker info
      # Separate build step from test step (mirrors local `mvn install` + `mvn test`):
      # a compile/packaging failure shows as its own red step, distinct from a test
      # failure, instead of both being buried inside one combined run.
      - name: Build (compile & package, skip tests)
        run: mvn -B clean install -DskipTests
      # -fae (fail-at-end): surfaces every failing test class in one run, not just
      # the first.
      - name: Run tests
        run: mvn -B -fae test
      - name: Test report - kafka-demo
        uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: Tests
          path: 'target/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-error: true
      - name: Upload raw surefire reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.txt'
          retention-days: 7
