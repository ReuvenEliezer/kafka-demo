server:
  port: 8080
spring:
  application:
    name: @project.artifactId@
  output:
    ansi:
      enabled: always
  kafka:
    admin:
      auto-create: true
    bootstrap-servers: localhost:29092
    topic: "my-topic-name"
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
          spring.json.trusted.packages: com.reuven.kafka.demo.entities
          spring.json.value.default.type: com.reuven.kafka.demo.entities.MyEvent
    consumer:
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "${spring.kafka.producer.properties.spring.json.trusted.packages}"
        spring.json.value.default.type: "${spring.kafka.producer.properties.spring.json.value.default.type}"
      auto-offset-reset: earliest
      group-id: myId
      suffix: ".DLT"# "-dlt" default

aws:
  s3:
    region: us-east-1
    bucket: kafka-demo-events
    endpoint: # set to a LocalStack/test endpoint to override the default AWS endpoint
    api-call-timeout: 10s

resilience4j:
  circuitbreaker:
    instances:
      s3Upload:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - software.amazon.awssdk.core.exception.SdkClientException
      s3Delivery:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - software.amazon.awssdk.core.exception.SdkClientException
      providerDownload:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - java.io.IOException
          - java.net.http.HttpTimeoutException

copy:
  consumer:
    strategy: inline
    topic: recording-copy
    group-id: recording-copy-group
    batch:
      max-records: 100
      max-wait: 1s
  backlog:
    high-water-mark: 10000
    low-water-mark: 5000
    check-interval: 5s
  delivery:
    worker-concurrency: 4
    poll-interval: 2s
    max-attempts: 10
    initial-backoff: 10s
    max-backoff: 30m
    claim-timeout: 5m
  chunking:
    threshold: 100MB
    base-part-size: 16MB
  checkpoint:
    expiry: 24h
    key-prefix: xfer
  cleanup:
    abandoned-upload-retention: 7d
    scan-interval: 1h
  size:
    max-plausible-bytes: 5TB
  provider:
    base-url:
    allowed-hosts: []
    credential-renewal-margin: 5m
    connect-timeout: 10s
    read-timeout: 60s
  notification:
    path: /provider/notifications
    secret: ${COPY_NOTIFICATION_SECRET:}
    freshness-window: 5m
    max-body-size: 1MB
  destination:
    bucket: ${aws.s3.bucket}
    key-prefix: recordings