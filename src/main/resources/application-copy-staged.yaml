spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/kafka_demo
    username: kafka_demo
    password: kafka_demo
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    consumer:
      properties:
        isolation.level: read_committed
