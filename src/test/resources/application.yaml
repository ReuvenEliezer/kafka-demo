spring:
  application:
    name: kafka-demo-test
  kafka:
    admin:
      auto-create: true
    bootstrap-servers: localhost:9092
    topic: "test-topic"
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.trusted.packages: com.reuven.kafka.demo.entities
        spring.json.value.default.type: com.reuven.kafka.demo.entities.MyEvent
    consumer:
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "${spring.kafka.producer.properties.spring.json.trusted.packages}"
        spring.json.value.default.type: "${spring.kafka.producer.properties.spring.json.value.default.type}"
      auto-offset-reset: earliest
      group-id: test-group
      suffix: ".DLT"

aws:
  s3:
    region: us-east-1
    bucket: kafka-demo-events-test
    endpoint:
    api-call-timeout: 1s

resilience4j:
  circuitbreaker:
    instances:
      s3Upload:
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 3s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - software.amazon.awssdk.core.exception.SdkClientException
      s3Delivery:
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 3s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - software.amazon.awssdk.core.exception.SdkClientException
      providerDownload:
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 3s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - java.io.IOException
          - java.net.http.HttpTimeoutException

# A test-classpath application.yaml replaces src/main/resources/application.yaml entirely rather
# than merging with it (only one classpath:application.yaml resolves), so every copy.* default has
# to be restated here too — not just the test-profile sizing overrides (quickstart.md
# "Test-profile sizing"). Same reason aws.s3.* and resilience4j.* above are restated rather than
# inherited.
copy:
  consumer:
    strategy: inline
    topic: recording-copy
    group-id: recording-copy-group
    batch:
      max-records: 100
      max-wait: 1s
  backlog:
    high-water-mark: 10000
    low-water-mark: 5000
    check-interval: 5s
  delivery:
    worker-concurrency: 4
    poll-interval: 2s
    max-attempts: 3
    initial-backoff: 10s
    max-backoff: 2s
    claim-timeout: 5m
  chunking:
    threshold: 5MB
    base-part-size: 5MB
  checkpoint:
    expiry: 60s
    key-prefix: xfer
  cleanup:
    abandoned-upload-retention: 7d
    scan-interval: 1h
  size:
    max-plausible-bytes: 5TB
  provider:
    base-url:
    allowed-hosts: []
    credential-renewal-margin: 5m
    connect-timeout: 10s
    read-timeout: 60s
  notification:
    path: /provider/notifications
    secret: ${COPY_NOTIFICATION_SECRET:}
    freshness-window: 5m
    max-body-size: 1MB
  destination:
    bucket: ${aws.s3.bucket}
    key-prefix: recordings
